server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the hashed build assets (Vite emits these to /static/,
    # NOT /assets/, so they never collide with the backend's /assets
    # upload path, which Traefik routes to the API instead).
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unknown path returns index.html so the
    # client-side router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
