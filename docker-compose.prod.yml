name: rf_studio_prod

# Single-server production stack for RF-Studio.
# One host, one domain, one TLS cert. Traefik routes by path:
#   https://${APP_DOMAIN}/graphql  -> app (API)
#   https://${APP_DOMAIN}/assets   -> app (uploaded photos)
#   https://${APP_DOMAIN}/*        -> web (React SPA)

services:
  traefik:
    # v3.6+ é obrigatório, não uma actualização de rotina. Até ao v3.6.1 o
    # cliente Docker do Traefik fixava a API na versão 1.24, que o Docker Engine
    # recente recusa ("minimum supported API version is 1.40"). O provider docker
    # morria em ciclo de retry, nenhum router nascia das labels, e o Traefik
    # respondia 404 a tudo — incluindo ao desafio ACME, pelo que nunca havia
    # certificado. O v3.6.1 passou a negociar a versão da API com o daemon.
    # Não descer daqui sem confirmar a versão do Docker no servidor.
    image: traefik:v3.6
    container_name: rf_studio_traefik
    restart: unless-stopped
    command:
      # Static config comes from the mounted file. O email do ACME está
      # hardcoded no traefik.yml (Traefik não interpola env vars no ficheiro estático).
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backend/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./backend/traefik/acme.json:/acme.json
    networks:
      - web

  # ---- Backend API (GraphQL + /assets) --------------------------------
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: rf_studio_app
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    volumes:
      - assets_data:/app/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      # Este container está em DUAS redes (web + internal). Sem esta label o
      # Traefik não sabe por qual o alcançar, pode escolher a `internal` — onde
      # não está ligado — e os pedidos ficam pendurados até expirar. O serviço
      # `web` não precisa disto porque só está numa rede.
      # O nome é <project>_<network>, e o project name está fixo no topo.
      - "traefik.docker.network=rf_studio_prod_web"
      # API + uploaded assets -> this container. Higher priority so these
      # paths win over the frontend catch-all below.
      - "traefik.http.routers.rfapi.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/graphql`) || PathPrefix(`/assets`))"
      - "traefik.http.routers.rfapi.entrypoints=websecure"
      - "traefik.http.routers.rfapi.tls.certresolver=letsencrypt"
      - "traefik.http.routers.rfapi.priority=100"
      - "traefik.http.services.rfapi.loadbalancer.server.port=8000"

  # ---- Frontend (React SPA served by nginx) ---------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: rf_studio_web
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      # Catch-all: everything not claimed by rfapi is the SPA.
      - "traefik.http.routers.rfweb.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.rfweb.entrypoints=websecure"
      - "traefik.http.routers.rfweb.tls.certresolver=letsencrypt"
      - "traefik.http.routers.rfweb.priority=1"
      - "traefik.http.services.rfweb.loadbalancer.server.port=80"

  postgres:
    image: postgres:16-alpine
    container_name: rf_studio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: rf_studio_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  web:
  internal:

volumes:
  pg_data:
  redis_data:
  assets_data:
